<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소냥이 포춘살롱 관리자</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .table-wrap { overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #ebd8fc; vertical-align: middle; }
    th { background: #f0e2fc; color: var(--deep-purple); font-weight: 700; white-space: nowrap; }
    .btn-view-report {
      background: #7942a6; color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
    }
    .badge-unapplied { background: #f3f3f3; color: #888; padding: 3px 6px; border-radius: 6px; font-size: 0.75rem; }
    .badge-applied { background: #e8d7fd; color: #5c2692; padding: 3px 6px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }
    .score-chart-box { background: #fdfbff; border: 1.5px solid #e2d1f7; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .score-name { width: 65px; font-weight: 700; color: var(--deep-purple); }
    .score-bar-bg { flex: 1; height: 12px; background: #eee3fb; border-radius: 6px; overflow: hidden; }
    .score-bar-fill { height: 100%; background: linear-gradient(90deg, #b885f0, #7942a6); border-radius: 6px; }
    .score-val { width: 45px; text-align: right; font-weight: 800; color: #7942a6; }
  </style>
</head>
<body>

  <div class="app-container wide">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="font-size:1.4rem; color:var(--deep-purple);">🔮 신청자 및 이탈자 실시간 통합 관리</h2>
      <a href="index.html" style="font-size:0.85rem; color:var(--primary-purple); text-decoration:none;">홈으로</a>
    </div>

    <!-- 로그인 -->
    <div id="login-box" style="text-align:center; padding:30px 10px;">
      <p style="margin-bottom:12px; color:#6e5c7e;">관리자 비밀번호를 입력해주세요.</p>
      <input type="password" id="admin-pw" class="form-control" style="max-width:240px; margin:0 auto 12px; display:block;" placeholder="기본: sonyangi777">
      <button class="btn-primary" style="max-width:240px;" onclick="fetchAdminData()">인증 후 조회</button>
    </div>

    <!-- 대시보드 -->
    <div id="admin-dashboard" style="display:none;">
      <div style="display:flex; gap:10px; margin-bottom:12px; justify-content:flex-end;">
        <button onclick="downloadCSV()" class="btn-primary" style="width:auto; padding:8px 14px; font-size:0.85rem;">📥 CSV 엑셀 다운로드 (동의여부/점수 포함)</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>구분</th>
              <th>상태</th>
              <th>신청자</th>
              <th>연락처</th>
              <th>개인정보동의</th>
              <th>진단 결과</th>
              <th>고민 사연</th>
              <th>일시</th>
              <th>점수 & 풀이서</th>
            </tr>
          </thead>
          <tbody id="applicant-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 풀이서 모달 -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-card" style="max-width: 580px;">
      <h3 id="modal-client-title">심층 풀이서 & 유형별 점수</h3>
      <p style="color:var(--primary-purple); font-weight:700; margin-bottom:10px;" id="modal-client-type"></p>

      <div id="modal-scores-section" style="display:none;">
        <h4 style="font-size:0.9rem; color:var(--deep-purple); margin-bottom:8px;">📊 9가지 소냥이 유형별 점수 (45점 만점)</h4>
        <div class="score-chart-box" id="modal-score-bars"></div>
      </div>
      
      <div style="background:#faf6ff; border:1px solid #d1b8eb; border-radius:12px; padding:16px; margin-bottom:16px; max-height:240px; overflow-y:auto; font-size:0.9rem; line-height:1.7; white-space:pre-line;" id="modal-report-body">
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn-primary" onclick="copyReportText()">📋 풀이서 내용 복사</button>
        <button onclick="closeReportModal()" style="background:#eee; border:none; border-radius:12px; padding:0 20px; font-weight:700; cursor:pointer;">닫기</button>
      </div>
    </div>
  </div>

  <script>
    let applicantList = [];

    async function fetchAdminData() {
      const pw = document.getElementById('admin-pw').value;
      try {
        const res = await fetch('/api/admin/list', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (data.success) {
          applicantList = data.list;
          document.getElementById('login-box').style.display = 'none';
          document.getElementById('admin-dashboard').style.display = 'block';
          renderAdminTable();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('조회 중 오류가 발생했습니다.');
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('applicant-tbody');
      tbody.innerHTML = '';
      applicantList.forEach((item, idx) => {
        const tr = document.createElement('tr');
        const isApplied = item.status === '신청접수' || item.status === '상담완료';
        tr.innerHTML = `
          <td><strong>${item.type}</strong></td>
          <td><span class="${isApplied ? 'badge-applied' : 'badge-unapplied'}">${item.status}</span></td>
          <td>${item.name}</td>
          <td>${item.phone}</td>
          <td><small style="color:${item.privacyAgree === '동의완료' ? '#2e7d32' : '#888'}; font-weight:700;">${item.privacyAgree || '미동의'}</small></td>
          <td><small style="font-weight:700; color:#5c2692;">${item.resultTitle}</small></td>
          <td><small>${item.story}</small></td>
          <td><small>${item.createdAt}</small></td>
          <td>
            <button class="btn-view-report" onclick="openAdminReport(${idx})">점수 & 풀이서</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openAdminReport(index) {
      const item = applicantList[index];
      document.getElementById('modal-client-title').innerText = `${item.name}님의 진단 리포트`;
      document.getElementById('modal-client-type').innerText = item.resultTitle;
      document.getElementById('modal-report-body').innerText = item.fullMessage || "풀이서 내용이 없습니다.";

      const scoreSection = document.getElementById('modal-scores-section');
      const scoreBarsBox = document.getElementById('modal-score-bars');

      if (item.scores && Object.keys(item.scores).length > 0) {
        scoreSection.style.display = 'block';
        scoreBarsBox.innerHTML = '';
        const sorted = Object.entries(item.scores).sort((a, b) => b[1] - a[1]);
        sorted.forEach(([typeName, score], rank) => {
          const pct = Math.min(100, Math.round((score / 45) * 100));
          const isTop = rank === 0;
          const row = document.createElement('div');
          row.className = 'score-row';
          row.innerHTML = `
            <div class="score-name" style="${isTop ? 'color:#7942a6; font-weight:800;' : ''}">${rank + 1}위 ${typeName}</div>
            <div class="score-bar-bg">
              <div class="score-bar-fill" style="width: ${pct}%; ${isTop ? 'background: linear-gradient(90deg, #ff88a5, #7942a6);' : ''}"></div>
            </div>
            <div class="score-val" style="${isTop ? 'color:#e63946;' : ''}">${score}점</div>
          `;
          scoreBarsBox.appendChild(row);
        });
      } else {
        scoreSection.style.display = 'none';
      }

      document.getElementById('report-modal').style.display = 'flex';
    }

    function closeReportModal() { document.getElementById('report-modal').style.display = 'none'; }

    function copyReportText() {
      const text = document.getElementById('modal-report-body').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("📋 고객 전송용 심층 풀이서가 복사되었습니다!");
      });
    }

    function downloadCSV() {
      const types = ["반듯냥", "다정냥", "반짝냥", "몽상냥", "탐구냥", "살핌냥", "두근냥", "대장냥", "포근냥"];
      let csvContent = "\uFEFF구분,상태,이름,연락처,개인정보동의,이메일,결과,고민,일시," + types.map(t => `${t}점수`).join(",") + "\n";

      applicantList.forEach(row => {
        const scoresObj = row.scores || {};
        const scoreCols = types.map(t => scoresObj[t] !== undefined ? scoresObj[t] : "-").join(",");
        csvContent += `"${row.type}","${row.status}","${row.name}","${row.phone}","${row.privacyAgree || '-'}","${row.email}","${row.resultTitle}","${row.story}","${row.createdAt}",${scoreCols}\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `소냥이_전체조회_신청내역_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
