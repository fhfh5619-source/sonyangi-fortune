<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>① 사주 오행 & 일주 분석 | 소냥이 포춘살롱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <!-- 1. 입력 화면 -->
    <div id="saju-input-view">
      <div style="text-align:left; margin-bottom:12px;">
        <a href="index.html" style="text-decoration:none; color:var(--primary-purple); font-weight:700; font-size:0.9rem;">← 처음으로</a>
      </div>
      <div class="brand-badge">🌟 STEP 1. 사주 분석</div>
      <h2 class="salon-title" style="margin:6px 0 16px;">생년월일 입력</h2>

      <div style="background:#faf6ff; border:1.5px solid var(--border-color); border-radius:18px; padding:18px; margin-bottom:20px; text-align:left;">
        <div class="form-group">
          <label>생년월일 (양력 기준)</label>
          <input type="date" id="saju-birth" class="form-control" value="1998-05-15">
        </div>
        <div class="form-group">
          <label>태어난 시간 (선택)</label>
          <select id="saju-time" class="form-control">
            <option value="unknown">시간 모름</option>
            <option value="자시">자시 (23:30 ~ 01:29)</option>
            <option value="축시">축시 (01:30 ~ 03:29)</option>
            <option value="인시">인시 (03:30 ~ 05:29)</option>
            <option value="묘시">묘시 (05:30 ~ 07:29)</option>
            <option value="진시">진시 (07:30 ~ 09:29)</option>
            <option value="사시">사시 (09:30 ~ 11:29)</option>
            <option value="오시">오시 (11:30 ~ 13:29)</option>
            <option value="미시">미시 (13:30 ~ 15:29)</option>
            <option value="신시">신시 (15:30 ~ 17:29)</option>
            <option value="유시">유시 (17:30 ~ 19:29)</option>
            <option value="술시">술시 (19:30 ~ 21:29)</option>
            <option value="해시">해시 (21:30 ~ 23:29)</option>
          </select>
        </div>
        <button class="btn-primary" onclick="calculateSaju()">나의 오행 고양이 확인하기 🔮</button>
      </div>
    </div>

    <!-- 2. 결과 화면 -->
    <div id="saju-result-view" style="display:none; text-align:center;">
      <div class="brand-badge" id="saju-badge">🌟 목(木) 성장의 에너지</div>
      <h2 class="salon-title" id="saju-res-title" style="margin: 4px 0 12px;">쑥쑥냥</h2>

      <div class="cat-img-box">
        <img id="saju-res-img" src="images/wood.jpg" alt="오행 소냥이 카드">
      </div>

      <div style="font-size: 0.95rem; font-weight: 700; color: var(--primary-purple); margin-bottom: 16px;" id="saju-keywords"></div>

      <!-- 요약 리포트 -->
      <div class="result-teaser">
        <span class="result-tag">✨ 타고난 기운 요약</span>
        <p class="teaser-text" id="saju-summary"></p>
      </div>

      <!-- 상세 풀이 (전체 오픈) -->
      <div style="background:#fff; border:1.5px solid #ded0f0; border-radius:18px; padding:18px; text-align:left; font-size:0.92rem; line-height:1.7; margin-bottom:20px;">
        <h4 style="color:var(--deep-purple); margin-bottom:8px;">📜 소냥이의 정밀 사주 풀이</h4>
        <div id="saju-full-content" style="white-space:pre-line; color:#4a355f;"></div>
      </div>

      <!-- 타로 검사 이동 버튼 -->
      <a href="tarot.html" class="btn-primary" style="display:inline-block; text-decoration:none; margin-bottom:12px;">
        ② 타로 마음 심리 테스트 하러 가기 🔮
      </a>

      <a href="saju.html" style="display:block; text-align:center; color:#888; font-size:0.85rem; text-decoration:none;">다른 생년월일 조회하기</a>
    </div>

  </div>

  <script>
    const SAJU_CATS = {
      "목": {
        name: "쑥쑥냥",
        title: "목(木) - 성장의 에너지",
        kw: "성장 · 배움 · 가능성",
        img: "images/wood.jpg",
        teaser: "씨앗을 뚫고 자라나는 새싹처럼 무한한 배움과 성장 잠재력을 지닌 쑥쑥냥입니다. 추진력이 뛰어나지만 시작한 일을 맺는 끈기가 필요합니다.",
        full: `• 타고난 본원: 새로운 시작을 두려워하지 않는 개척자적 기질을 가졌습니다.\n• 운의 흐름: 아이디어와 기획력이 번뜩이나, 흙(土)의 정착력이 부족하면 뒷심이 약해질 수 있습니다.\n• 대인관계: 사람들을 따뜻하게 품고 이끌지만, 내 방식이 옳다는 고집을 조금 덜어내면 귀인이 모입니다.\n• 소냥이 개운법: 푸른색 의상이나 식물을 가까이하고, 작은 일이라도 끝까지 완결 짓는 습관을 들이세요.`
      },
      "화": {
        name: "활활냥",
        title: "화(火) - 열정의 에너지",
        kw: "열정 · 도전 · 성장",
        img: "images/fire.jpg",
        teaser: "세상을 환하게 비추는 태양처럼 뜨거운 열정과 솔직한 매력을 가진 활활냥입니다. 불꽃처럼 타오르다 쉽게 방전되지 않도록 휴식이 중요합니다.",
        full: `• 타고난 본원: 솔직하고 화끈하며 정열적인 매력으로 어두운 분위기를 밝히는 빛입니다.\n• 운의 흐름: 사람을 끄는 흡인력이 강력하나, 감정이 앞서면 말실수로 구설에 오를 수 있습니다.\n• 대인관계: 열정적이고 헌신적이지만 불꽃처럼 타오르다 쉽게 지칠 수 있으니 완급 조절이 필요합니다.\n• 소냥이 개운법: 차분한 네이비/블랙 계열 소품을 착용하고, 호흡 명상이나 반신욕으로 열기를 식혀주세요.`
      },
      "토": {
        name: "든든냥",
        title: "토(土) - 안정의 에너지",
        kw: "안정 · 신뢰 · 꾸준함",
        img: "images/earth.jpg",
        teaser: "넓은 대지처럼 깊은 포용력과 묵직한 신뢰를 지닌 든든냥입니다. 속마음을 잘 드러내지 않아 오해를 사거나 혼자 앓기 쉽습니다.",
        full: `• 타고난 본원: 믿음직스럽고 중재를 잘하며 사람들을 이어주는 든든한 대지와 같습니다.\n• 운의 흐름: 큰 풍파 없이 꾸준하게 자산을 모으나, 보수적인 성향으로 좋은 기회를 망설이다 놓칠 수 있습니다.\n• 대인관계: 한결같아 평생 친구가 많지만, 고집을 부리기 시작하면 타협이 어려워질 수 있습니다.\n• 소냥이 개운법: 조용한 숲길 산책을 즐기고, 마음에 담아둔 이야기를 일기나 가까운 이에게 솔직히 털어놓으세요.`
      },
      "금": {
        name: "반짝금냥",
        title: "금(金) - 원칙의 에너지",
        kw: "정확함 · 신뢰 · 성취",
        img: "images/metal.jpg",
        teaser: "단단한 바위처럼 확고한 원칙과 칼 같은 결단력을 지닌 반짝금냥입니다. 냉철한 기준 탓에 주변 사람이 다가가기 어려울 수 있습니다.",
        full: `• 타고난 본원: 의리가 깊고 정직하며 군더더기 없는 완벽한 결단력을 자랑합니다.\n• 운의 흐름: 전문 분야에서 두각을 나타내며 성취가 크지만, 융통성이 부족하면 마찰이 잦습니다.\n• 대인관계: 맺고 끊음이 확실하여 뒤끝이 없으나, 차가운 말 한마디로 상대에게 상처를 줄 수 있습니다.\n• 소냥이 개운법: 따스한 원목(우드) 인테리어를 가까이하고, 상대방의 작은 실수를 너그럽게 품어주세요.`
      },
      "수": {
        name: "찰랑냥",
        title: "수(水) - 지혜의 에너지",
        kw: "지혜 · 통찰 · 유연함",
        img: "images/water.jpg",
        teaser: "굽이치는 강물처럼 유연한 적응력과 깊은 통찰력을 지닌 찰랑냥입니다. 생각이 너무 깊어 밤마다 잠 못 드는 고민에 빠지기 쉽습니다.",
        full: `• 타고난 본원: 환경에 맞춰 모양을 바꾸는 물처럼 위기 극복 능력과 두뇌 회전이 매우 뛰어납니다.\n• 운의 흐름: 통찰력과 영민함이 최상이나, 잡생각이 꼬리를 물면 우울감이나 방황에 빠지기 쉽습니다.\n• 대인관계: 공감 능력이 좋아 주변에 사람이 많지만, 내 진짜 속내는 끝까지 감추는 경향이 있습니다.\n• 소냥이 개운법: 실내 조명을 환하게 켜고 햇볕을 자주 쬐며, 생각을 즉시 실행으로 옮기는 단호함을 가지세요.`
      }
    };

    const STEMS = ["갑(甲)", "을(乙)", "병(丙)", "정(丁)", "무(戊)", "기(己)", "경(庚)", "신(辛)", "임(壬)", "계(癸)"];
    const STEM_ELEMENTS = ["목", "목", "화", "화", "토", "토", "금", "금", "수", "수"];
    const BRANCHES = ["자(子)", "축(丑)", "인(寅)", "묘(卯)", "진(辰)", "사(巳)", "오(午)", "미(未)", "신(申)", "유(酉)", "술(戌)", "해(亥)"];

    async function calculateSaju() {
      const birthStr = document.getElementById('saju-birth').value;
      if (!birthStr) return alert("생년월일을 선택해주세요.");

      const parts = birthStr.split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);

      const a = Math.floor((14 - month) / 12);
      const y = year + 4800 - a;
      const m = month + 12 * a - 3;
      const jdn = day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;

      const stemIdx = (jdn + 9) % 10;
      const branchIdx = (jdn + 1) % 12;

      const stem = STEMS[stemIdx];
      const branch = BRANCHES[branchIdx];
      const elem = STEM_ELEMENTS[stemIdx];
      const iljuName = `${stem}${branch} 일주`;
      const cat = SAJU_CATS[elem];
      const title = `[사주] ${iljuName} · ${cat.name}`;

      document.getElementById('saju-input-view').style.display = 'none';
      document.getElementById('saju-result-view').style.display = 'block';

      document.getElementById('saju-badge').innerText = `🌟 ${cat.title}`;
      document.getElementById('saju-res-title').innerText = `${iljuName} · ${cat.name}`;
      document.getElementById('saju-keywords').innerText = cat.kw;
      document.getElementById('saju-res-img').src = cat.img;
      document.getElementById('saju-summary').innerText = cat.teaser;
      document.getElementById('saju-full-content').innerText = cat.full;

      // 사주 결과 도달 시 자동 로깅
      try {
        await fetch('/api/auto-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: "사주 오행 분석",
            resultTitle: title,
            resultCode: "SAJU_" + elem,
            scores: null
          })
        });
      } catch (e) {}
    }
  </script>
</body>
</html>
