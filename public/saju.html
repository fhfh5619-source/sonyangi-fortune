<!-- 결과 뷰 -->
<div id="saju-result-view" style="display:none; text-align:center;">
  <div class="header-salon">
    <div class="brand-badge" id="saju-badge">🌟 오행 분석</div>
    <h2 class="salon-title" id="saju-res-title" style="font-size:1.8rem; margin: 4px 0 12px;"></h2>
  </div>

  <!-- 오행 소냥이 카드 일러스트 이미지 -->
  <div style="max-width: 280px; margin: 0 auto 16px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(110,48,160,0.2); border: 3px solid var(--border-color);">
    <img id="saju-res-img" src="" alt="오행 소냥이 카드" style="width: 100%; display: block;">
  </div>

  <div style="font-size: 0.95rem; font-weight: 700; color: var(--primary-purple); margin-bottom: 16px;" id="saju-keywords"></div>

  <!-- 2~3줄 요약 공개 리포트 -->
  <div class="result-teaser" style="text-align: left;">
    <span class="result-tag">✨ 타고난 기운 요약</span>
    <p class="teaser-text" id="saju-summary"></p>
  </div>

  <!-- 잠금 블러 리포트 -->
  <div class="locked-box">
    <div class="blurred-content">
      <p><strong>[대운과 세운의 흐름]</strong> 다가오는 시기에는 나를 돕는 기운과 부딪히는 기운이 교차합니다.</p>
      <p style="margin-top:10px;"><strong>[재물 및 연애궁합 상세]</strong> 나와 가장 합이 맞는 오행은 부족한 기운을 채워주는 보완적 관계입니다.</p>
    </div>

    <div class="lock-overlay">
      <div class="lock-icon">🔒</div>
      <div class="lock-msg">심층 사주 원국 풀이가 잠겨있어요</div>
      <div class="lock-sub">풀이 신청을 남겨주시면 나의 일주와 오행에 맞는<br>무료 정밀 사주 풀이를 100% 무료로 발송해 드립니다.</div>
      <button class="btn-primary" onclick="openModal()">전체 사주 풀이 무료 신청 🎁</button>
    </div>
  </div>

  <a href="saju.html" style="display:block; text-align:center; color:var(--text-muted); font-size:0.9rem; text-decoration:none;">다시 계산하기</a>
</div>
